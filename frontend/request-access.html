<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request access — PERINAV</title>
    <link rel="stylesheet" href="./style.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Sharp" rel="stylesheet">
</head>
<body class="auth-page">

    <header class="auth-header">
        <a href="index.html" class="logo">
            <img src="./images/logo.jpeg" alt="">
            <h2>PERINAV</h2>
        </a>
    </header>

    <main class="auth-main">
        <div class="auth-card-wrap">
            <div class="auth-intro">
                <h1>Request access</h1>
                <p>Your service administrator reviews requests and sets up accounts.
                You'll hear back by email.</p>
            </div>

            <div class="panel">
                <form class="form" onsubmit="return false;">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="name">Full name</label>
                            <input type="text" id="name">
                        </div>
                        <div class="form-group">
                            <label for="role">Role</label>
                            <select id="role">
                                <option>Midwife</option>
                                <option>Maternal health nurse</option>
                                <option>General practitioner</option>
                                <option>Obstetrician</option>
                                <option>Other</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="email">Work email</label>
                        <input type="email" id="email" placeholder="name@service.health">
                    </div>
                    <div class="form-group">
                        <label for="org">Service or organisation</label>
                        <input type="text" id="org">
                    </div>
                    <div class="form-group">
                        <label for="reg">Registration number, if applicable</label>
                        <input type="text" id="reg">
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Send request</button>
                </form>
            </div>

            <div class="notice" style="margin-top:1.2rem">
                <span class="material-icons-sharp">schedule</span>
                <p>Requests are usually reviewed within two working days. Access is granted
                per service, not per individual device.</p>
            </div>

            <p class="auth-alt">
                Already have an account? <a href="login.html" class="link">Log in</a>
            </p>
        </div>
    </main>


</body>
</html>
