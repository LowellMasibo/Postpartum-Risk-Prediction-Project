<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signed out — PERINAV</title>
    <link rel="stylesheet" href="./style.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Sharp" rel="stylesheet">
</head>
<body class="auth-page">

    <header class="auth-header">
        <a href="index.html" class="logo">
            <img src="./images/logo.jpeg" alt="">
            <h2>PERINAV</h2>
        </a>
    </header>

    <main class="auth-main">
        <div class="auth-card-wrap center-text">
            <span class="material-icons-sharp timeout-icon">lock_clock</span>
            <h1>You've been signed out</h1>
            <p>Your session ended after 15 minutes without activity, to keep patient
            information secure on shared devices.</p>

            <div class="panel text-left">
                <h3>Your draft assessment was saved</h3>
                <p>P-4519, saved at 14:22. It will be waiting when you sign back in.</p>
            </div>

            <a href="login.html" class="btn btn-primary btn-block">Sign back in</a>
        </div>
    </main>


</body>
</html>
